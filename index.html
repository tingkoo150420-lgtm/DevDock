<!doctype html>
<html lang="ko">
<head>
  <!-- Google Search Console verification -->
  <meta name="google-site-verification" content="dZYekcHXTu7P1MDVOmVvv0dP6lUyaufASDt_bfHrt8Y" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevDock — Browser Code Runner</title>
  <meta name="description" content="DevDock는 브라우저에서 바로 실행되는 온라인 코드 실행기입니다. JavaScript, Python(Pyodide), Lua, 나만의 언어를 지원합니다." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --line:#1f2937;
      --text:#fff;
      --muted:#9ca3af;
      --accent:#22c55e;
      --danger:#ef4444;
      --radius:16px;

      --title-font:"Black Han Sans", system-ui, sans-serif;
      --ui-font:"Noto Sans KR", system-ui, sans-serif;
      --mono-font:"JetBrains Mono", ui-monospace, monospace;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--ui-font);
    }

    /* Top bar */
    .top{
      height:60px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      border-bottom:1px solid var(--line);
      background:#050505;
    }
    .brand{
      font-family:var(--title-font);
      font-size:22px;
      letter-spacing:1px;
    }
    .btn{
      border:1px solid var(--line);
      background:#0b0b0b;
      color:#fff;
      padding:8px 14px;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(180deg,#22c55e,#16a34a);
      border:none;
      color:#041007;
    }

    /* Layout */
    .main{
      max-width:1100px;
      margin:16px auto;
      padding:0 12px;
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:12px;
    }
    @media(max-width:900px){
      .main{grid-template-columns:1fr}
    }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:#0b0b0b;
      overflow:hidden;
    }
    .card-head{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    /* Editor */
    textarea{
      width:100%;
      height:420px;
      resize:none;
      border:none;
      outline:none;
      background:#000;
      color:#fff;
      padding:12px;
      font-family:var(--mono-font);
      font-size:14px;
      line-height:1.5;
    }

    /* Output */
    pre{
      margin:0;
      padding:12px;
      font-family:var(--mono-font);
      font-size:13px;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .muted{color:var(--muted)}
    .err{color:var(--danger)}
    .ok{color:var(--accent)}

    select{
      background:#000;
      color:#fff;
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:10px;
      font-weight:700;
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="brand">DevDock</div>
    <div>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn primary" id="runBtn">Run</button>
    </div>
  </div>

  <div class="main">
    <!-- Editor -->
    <div class="card">
      <div class="card-head">
        <b>Editor</b>
        <select id="lang">
          <option value="js">JavaScript</option>
          <option value="py">Python</option>
          <option value="lua">Lua</option>
          <option value="mylang">MyLang</option>
        </select>
      </div>
      <textarea id="code">// DevDock
console.log("Hello DevDock!");
      </textarea>
    </div>

    <!-- Output -->
    <div class="card">
      <div class="card-head">
        <b>Output</b>
      </div>
      <pre id="out"><span class="muted">Ready.</span></pre>
    </div>
  </div>

<script>
const out = document.getElementById("out");
const code = document.getElementById("code");
const lang = document.getElementById("lang");

function log(msg, cls=""){
  const span=document.createElement("span");
  span.className=cls;
  span.textContent=msg+"\n";
  out.appendChild(span);
}

function clearOut(){
  out.textContent="";
  log("cleared.","muted");
}

document.getElementById("clearBtn").onclick=clearOut;

document.getElementById("runBtn").onclick=async()=>{
  clearOut();
  const src=code.value;

  if(lang.value==="js"){
    try{
      const r = new Function(src);
      r();
      log("done.","ok");
    }catch(e){
      log(String(e),"err");
    }
  }
  else if(lang.value==="mylang"){
    const lines=src.split("\n");
    const vars={};
    for(let i=0;i<lines.length;i++){
      const l=lines[i].trim();
      if(!l||l.startsWith("#")) continue;
      if(l.startsWith("print ")){
        log(l.slice(6),"ok");
      }else{
        log("Line "+(i+1)+" unknown","err");
      }
    }
  }
  else{
    log("이 언어는 데모 UI입니다.","muted");
  }
};
</script>
</body>
</html>
